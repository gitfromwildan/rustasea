# sccache is opt-in: export `RUSTC_WRAPPER=sccache` (or set
# `build.rustc-wrapper` in your own `~/.cargo/config.toml`) to route rustc
# through it. A machine-specific wrapper path here would break every other
# checkout; CI sets `RUSTC_WRAPPER` only in the jobs that install sccache.
[env]
SCCACHE_CACHE_SIZE = "5G"
CARGO_INCREMENTAL = "0"

# Convenience alias so the documented `cargo xtask <task>` surface works without
# a separate `cargo-xtask` binary (ADOPT-030). Expands to `cargo run -p xtask --`.
[alias]
xtask = "run -p xtask --"
