# RustaSea storage configuration.
#
# Parsed by `rustasea-storage`'s config facade (`StorageManager::from_toml_file`).
# `default` selects the disk used when no `read_through` pair is configured;
# `read_through` mirrors the FS-M6-02 `{ primary, fallback, copy_back }`
# contract (read-through with optional copy-back to the primary).
#
# Cloud drivers are opt-in: enable the matching crate feature
# (`rustasea-storage/{aws,gcp,azure}`) before referencing `s3`, `gcs`, or
# `azure` disks. The `sftp` driver is likewise opt-in
# (`rustasea-storage/sftp`, or `storage-sftp` on the `rustasea` facade crate).

[storage]
default = "local"

# Read-through routing (uncomment once the cloud disk below is enabled):
# [storage.read_through]
# primary = "s3"
# fallback = "local"
# copy_back = true

# Symlinks materialized by `StorageManager::create_links` (Laravel's
# `storage:link`). Key = link path, value = target.
[storage.links]
"public/storage" = "storage/app/public"

[storage.disks.local]
driver = "local"
root = "storage/app"
# Expose this disk through the framework dev server.
serve = true
# `local` (private) or `public` object visibility.
visibility = "local"
# Raise on failure instead of returning a falsy result.
throw = false
# Surface failures to the error reporter.
report = false

[storage.disks.public]
driver = "local"
root = "storage/app/public"
# Publicly reachable objects (served via the `public/storage` link).
visibility = "public"
throw = false
report = false

[storage.disks.archive]
driver = "local"
root = "storage/archive"
visibility = "local"
throw = false
report = false

# --- Cloud disk examples (enable the matching feature to use) ---------------
#
# [storage.disks.s3]
# driver = "s3"
# bucket = "rustasea"
# region = "us-east-1"
# visibility = "public"
# throw = false
# report = false
# # Prefer the environment over inline credentials: AWS_ACCESS_KEY_ID,
# # AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, AWS_BUCKET, and AWS_ENDPOINT
# # override the matching keys on every `s3` disk (blank values are ignored),
# # and `bucket` may be left out when AWS_BUCKET is set. `.env.example` sets
# # AWS_DEFAULT_REGION, so change the region there. With more than one `s3`
# # disk, leave AWS_BUCKET and AWS_ENDPOINT blank and set them per disk here.
# # access_key_id = "..."
# # secret_access_key = "..."
# # S3-compatible services (RustFS, MinIO, R2). An `http://` endpoint enables
# # plain HTTP for local development; any other endpoint stays HTTPS-only.
# # endpoint = "http://localhost:9000"
#
# [storage.disks.gcs]
# driver = "gcs"
# bucket = "rustasea"
# visibility = "public"
# # service_account_path = "/etc/rustasea/gcs-service-account.json"
#
# [storage.disks.azure]
# driver = "azure"
# account = "rustasea"
# container = "app"
# visibility = "public"
# # access_key = "..."

# --- SFTP disk example (enable `rustasea-storage/sftp` / `storage-sftp`) -----
#
# [storage.disks.sftp]
# driver = "sftp"
# host = "files.example.com"
# port = 22
# username = "deploy"
# # Prefer the environment (`SFTP_PASSWORD`) or a secret manager over inline
# # credentials. The password is redacted from debug output.
# # password = "..."
# # Prefer key auth when available (`SFTP_PRIVATE_KEY` overrides this).
# # private_key_path = "/etc/rustasea/id_ed25519"
# root = "/srv/upload"
# # Per-request timeout in seconds (default 30).
# timeout = 30
# # Optional SHA-256 host-key pin (`SHA256:<base64>`); a mismatch aborts the
# # connection. When absent the host key is accepted (trust on first use).
# # host_key = "SHA256:...."
